services:
  bloat:
    image: git.fjox.win/fjox/bloat
    container_name: bloat-tor
    ports:
      - "8080:8080"
    restart: unless-stopped
    volumes:
      - ./bloat.conf:/app/bloat.conf
    cap_add:
      - SYS_NICE
    extra_hosts:
      - "v3oniondomainhereioshgposihgpyosh.onion:webserverip"
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 32M